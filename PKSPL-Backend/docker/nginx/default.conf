server {
    listen 80;
    client_max_body_size 50M;

    # Protect hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Laravel Public Storage (Uploaded files, avatars)
    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        try_files $uri $uri/ =404;
        access_log off;
        expires max;
    }

    # Laravel Reverb WebSocket proxy
    location /app/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $reverb_backend http://reverb:8080;
        proxy_pass $reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Laravel Health Check
    location = /up {
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # Laravel API endpoints
    location ^~ /api {
        root /var/www/html/public;
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_read_timeout 120s;
    }

    # Frontend React SPA
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}